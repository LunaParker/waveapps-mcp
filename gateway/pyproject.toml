[project]
name = "waveapps-mcp-gateway"
version = "0.1.0"
description = "Google OAuth gate in front of waveapps-mcp's HTTP transport"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["fastmcp==4.1.1"]

[project.scripts]
waveapps-mcp-gateway = "waveapps_gateway.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waveapps_gateway"]

[tool.uv]
# Every locked release is at least two weeks old (repo rule); bump with the fastmcp pin.
exclude-newer = "2026-10-18T03:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# GoogleProvider pulls in authlib's deprecated httpx client module; the warning is upstream's.
filterwarnings = ["ignore:The httpx module is deprecated:authlib.deprecate.AuthlibDeprecationWarning"]
